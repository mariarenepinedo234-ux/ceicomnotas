services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceicom
      POSTGRES_USER: ceicom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta npm run configurar primero}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ceicom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceicom -d ceicom"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ceicom_postgres:
